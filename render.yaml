services:
  - type: web
    name: escuela-cafe
    runtime: python
    build:
      buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py seed_data && python manage.py collectstatic --noinput
      publish: staticfiles
    startCommand: gunicorn escuela_cafe.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "escuelaoaqueniacafe2.onrender.com,localhost,127.0.0.1"
